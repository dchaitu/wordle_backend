version: '3.9'

services:
  mysql:
    image: mysql:latest
    environment:
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: wordle_db
    ports:
      - "3333:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: mysql --password=admin -e "SHOW DATABASES"

  django:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DJANGO_SETTINGS_MODULE: wordle_backend.settings
      DATABASE_HOST: mysql
      DATABASE_NAME: wordle_db
      DATABASE_USER: root
      DATABASE_PASSWORD: admin
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
